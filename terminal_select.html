<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Select POS Terminal</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./js/page-auth.js?v=26"></script>
    <script type="module" src="./js/terminal-select.js?v=2"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
    <link href="./css/app-theme.css?v=3" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">POS &amp; AR Master Files</a>
        <ul class="navbar-nav flex-row gap-2"></ul>
      </div>
    </nav>
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
          <div class="card shadow-sm">
            <div class="card-header"><h1 class="h4 mb-0">Choose POS Terminal</h1></div>
            <div class="card-body">
              <p>Select the terminal you are using. This selection applies to your sales until you log out.</p>
              <div id="terminal-error" class="alert alert-danger d-none" role="alert"></div>
              <form id="terminal-select-form">
                <label class="form-label" for="terminal_id">POS Terminal</label>
                <select class="form-select mb-3" id="terminal_id" required>
                  <option value="">Loading terminals...</option>
                </select>
                <button class="btn btn-primary w-100" id="select-terminal-button" disabled>Continue to POS</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
