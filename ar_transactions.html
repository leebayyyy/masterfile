<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR Transactions</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./js/page-auth.js?v=21"></script>    <script type="module" src="./js/ar-transactions.js?v=3"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
  </head>
  <body><nav class="navbar navbar-dark bg-dark"><div class="container-fluid"><a class="navbar-brand" href="index.html">POS &amp; AR Master Files</a><ul class="navbar-nav flex-row gap-2"><li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li><li class="nav-item"><a class="nav-link active" href="ar_transactions.html">AR Transactions</a></li></ul></div></nav>
    <main class="container mt-4"><div class="d-flex justify-content-between"><h1>AR TRANSACTIONS</h1><button class="btn btn-primary d-none" id="btn-new-memo" data-bs-toggle="modal" data-bs-target="#memo-modal">New Memo</button></div><div id="invoices" class="mt-3"></div><div id="memos" class="mt-4"></div></main>
    <div class="modal fade" id="memo-modal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><form id="memo-form"><div class="modal-header"><h5>New Credit/Debit Memo</h5></div><div class="modal-body"><select class="form-select mb-2" id="memo_type" required><option value="Credit">Credit Memo</option><option value="Debit">Debit Memo</option></select><select class="form-select mb-2" id="memo_invoice" required></select><input class="form-control" type="number" min="0.01" step="0.01" id="memo_amount" placeholder="Amount" required /></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button><button class="btn btn-primary">Save</button></div></form></div></div></div>
    <div class="modal fade" id="invoice-modal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><form id="invoice-form"><div class="modal-header"><h5>Create AR Invoice</h5></div><div class="modal-body"><p id="invoice-sale-summary" class="text-muted"></p><input type="hidden" id="invoice-sale-id"><input type="hidden" id="invoice-pending-id"><label class="form-label" for="invoice-date">Invoice Date</label><input class="form-control mb-2" type="date" id="invoice-date" required><label class="form-label" for="invoice-due-date">Due Date</label><input class="form-control mb-2" type="date" id="invoice-due-date" required><label class="form-label" for="invoice-amount">Invoice Total</label><input class="form-control mb-2" type="number" id="invoice-amount" readonly><label class="form-label" for="invoice-balance">Remaining Balance</label><input class="form-control" type="number" id="invoice-balance" readonly><small class="form-text">The opening balance starts at the sale total and is reduced by posted payments or credit memos.</small></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button><button class="btn btn-primary">Create Invoice</button></div></form></div></div></div>
  </body>
</html>
