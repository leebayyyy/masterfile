<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In &mdash; POS &amp; AR Master Files</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
    <link href="./css/app-theme.css?v=2" rel="stylesheet" />
    <script type="module" src="./js/login.js?v=20261021"></script>
  </head>
  <body class="login-page">
    <main class="login-container">
      <div class="login-card">
        <!-- Header -->
        <div class="login-header">
          <div class="login-badge">Retail Management Suite</div>
          <h1 class="login-title">POS &amp; Accounts Receivable</h1>
          <p class="login-subtitle">Sign in to access your authorized workspace</p>
        </div>

        <!-- Form Body -->
        <div class="login-body">
          <div id="login-error" class="alert alert-danger d-flex align-items-center gap-2 py-2 px-3 small d-none" role="alert">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-exclamation-triangle-fill flex-shrink-0" viewBox="0 0 16 16">
              <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
            </svg>
            <span id="login-error-text">Invalid username or password.</span>
          </div>

          <form id="login-form" novalidate>
            <div class="mb-3">
              <label class="login-form-label" for="username">Username</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-secondary border-end-0">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person-fill" viewBox="0 0 16 16">
                    <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3Zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/>
                  </svg>
                </span>
                <input
                  type="text"
                  class="form-control login-form-control border-start-0 ps-0"
                  id="username"
                  name="username"
                  placeholder="Enter your username"
                  autocomplete="username"
                  required
                  autofocus
                />
              </div>
            </div>

            <div class="mb-4">
              <label class="login-form-label" for="password">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-secondary border-end-0">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-lock-fill" viewBox="0 0 16 16">
                    <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/>
                  </svg>
                </span>
                <input
                  type="password"
                  class="form-control login-form-control border-start-0 border-end-0 px-0"
                  id="password"
                  name="password"
                  placeholder="Enter your password"
                  autocomplete="current-password"
                  required
                />
                <button
                  class="btn btn-outline-secondary border-start-0"
                  type="button"
                  id="toggle-password"
                  aria-label="Show password"
                  aria-pressed="false"
                >
                  <svg id="password-visible-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden>
                    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                  <svg id="password-hidden-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 3l18 18"></path>
                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                    <path d="M9.9 5.2A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a14.8 14.8 0 0 1-3.2 4.1"></path>
                    <path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.8 10.8 0 0 0 4-.8"></path>
                  </svg>
                </button>
              </div>
            </div>

            <button class="btn btn-primary w-100 login-submit-btn text-white fw-bold" type="submit" id="login-submit-btn">
              <span class="spinner-border spinner-border-sm me-2 d-none" id="login-spinner" role="status" aria-hidden="true"></span>
              <span id="login-submit-text">Sign In to Workspace</span>
            </button>
          </form>

          <div class="login-footer-note">
            Role-Scoped System &bull; Cashier &bull; Admin &bull; Manager &bull; AR Staff
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
