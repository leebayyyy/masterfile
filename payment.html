<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="./js/page-auth.js?v=21"></script>
    <script type="module" src="./js/payment.js?v=5"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">POS &amp; AR Master Files</a>
        <ul class="navbar-nav flex-row flex-wrap gap-2">
          <li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="role.html">Roles</a></li>
          <li class="nav-item"><a class="nav-link" href="user.html">Users</a></li>
          <li class="nav-item"><a class="nav-link" href="product_category.html">Product Categories</a></li>
          <li class="nav-item"><a class="nav-link" href="product.html">Products</a></li>
          <li class="nav-item"><a class="nav-link" href="pos_terminal.html">POS Terminals</a></li>
          <li class="nav-item"><a class="nav-link" href="ar_customer_type.html">Customer Types</a></li>
          <li class="nav-item"><a class="nav-link" href="ar_customer.html">AR Customers</a></li>
          <li class="nav-item"><a class="nav-link active" href="payment.html">Payments</a></li>
        </ul>
      </div>
    </nav>

    <div class="container mt-4">
      <div id="header-div" class="d-flex justify-content-between align-items-center">
        <h1 id="header-text">PAYMENTS</h1>
        <button type="button" class="btn btn-primary d-none" id="btn-add" data-bs-toggle="modal" data-bs-target="#payment-modal">Add</button>
      </div>
      <div id="table-div" class="mt-3"></div>
    </div>

    <div class="modal fade" id="payment-modal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <form id="payment-form">
            <div class="modal-header text-white" style="background-color:#006400">
              <h5 class="modal-title">Add Payment</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label" for="ar_invoice_id">Invoice</label>
                  <select class="form-select" id="ar_invoice_id" required>
                    <option value="">-- SELECT OPEN INVOICE --</option>
                  </select>
                  <div class="form-text" id="invoice-balance">Select an invoice to view its outstanding balance.</div>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="payment_date">Payment Date</label>
                  <input type="date" class="form-control" id="payment_date" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="amount">Amount</label>
                  <input type="number" class="form-control" id="amount" min="0.01" step="0.01" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="payment_method_id">Payment Method</label>
                  <select class="form-select" id="payment_method_id" required>
                    <option value="">-- SELECT PAYMENT METHOD --</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="reference_number">Reference Number</label>
                  <input type="text" class="form-control" id="reference_number" placeholder="Generated automatically when saved" readonly />
                </div>
                <div class="col-12">
                  <label class="form-label" for="notes">Notes</label>
                  <textarea class="form-control" id="notes" maxlength="255" rows="2"></textarea>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
              <button type="submit" class="btn btn-primary">Submit</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
