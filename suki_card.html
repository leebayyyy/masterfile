<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUKI Cards</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script><script type="module" src="./js/page-auth.js?v=20261021"></script><script type="module" src="./js/suki-card.js?v=20261021"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-dark bg-dark"><div class="container-fluid"><a class="navbar-brand" href="index.html">POS &amp; AR Master Files</a><ul class="navbar-nav flex-row gap-2"><li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li><li class="nav-item"><a class="nav-link active" href="suki_card.html">SUKI Cards</a></li></ul></div></nav>
<main class="container mt-4">
  <div class="d-flex justify-content-between align-items-center"><h1>SUKI CARDS</h1><button class="btn btn-primary d-none" id="btn-add-card" data-bs-toggle="modal" data-bs-target="#card-modal">Add</button></div>
  <p class="text-muted">Customer-linked card balances and registered-card sales activity. Cash-sale points are recorded as a receipt snapshot and do not automatically change the registered balance.</p>
  <div id="suki-error" class="alert alert-danger d-none" role="alert"></div>
  <div id="cards" class="mt-3"></div>
</main>
<div class="modal fade" id="card-modal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><form id="card-form" class="d-none"><div class="modal-header"><h5>Add SUKI Card</h5></div><div class="modal-body"><select class="form-select mb-2" id="customer_id" required></select><label class="form-label small fw-semibold" for="card_number">Card Number (Auto-generated)</label><input class="form-control mb-2 font-monospace bg-light" id="card_number" placeholder="SUKI-0001" readonly required><label class="form-label" for="issued_date">Issue date</label><input class="form-control mb-2" type="date" id="issued_date"><label class="form-label" for="expiry_date">Expiry date (optional)</label><input class="form-control" type="date" id="expiry_date"></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button><button class="btn btn-primary">Submit</button></div></form></div></div></div>
</body>
</html>
