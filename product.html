    </nav>
    <div class="container mt-4">
      <div id="header-div" class="d-flex justify-content-between align-items-center">
        <h1 id="header-text">PRODUCTS</h1>
        <button type="button" class="btn btn-primary" id="btn-add" data-bs-toggle="modal" data-bs-target="#blank-modal">Add</button>
      </div>
      <div id="main-div">
      </div>
      <div id="table-div" class="mt-3"></div>
      <div id="footer-div"></div>
    </div>

  <!-- BLANK MODAL -->
  <div class="modal fade" id="blank-modal" role="dialog" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-md">
      <div class="modal-content">
        <div class="modal-header text-white" style="background-color:#006400">
          <h5 class="modal-title" id="blank-modal-title">Add Product</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="blank-modal-body">
          <form id="add-product-form">
            <div class="row g-2" id="blank-main-div" style="padding:5px;">
              <div class="col-md-6">
                <input type="text" class="form-control" id="product_name" placeholder="Product Name" maxlength="200" required />
              </div>
              <div class="col-md-6">
                <input type="number" step="0.01" min="0" max="99999999.99" class="form-control" id="price" placeholder="Price" />
              </div>
              <div class="col-md-6">
                <select class="form-select" id="category_id" required>
                  <option value="">-- SELECT CATEGORY --</option>
                </select>
              </div>
              <div class="col-md-6">
                <select class="form-select" id="unit_of_measure_id" required>
                  <option value="">-- SELECT UNIT OF MEASURE --</option>
                </select>
              </div>
              <div class="col-md-6">
                <div class="form-control bg-light text-muted fw-bold" style="cursor: not-allowed;" title="Static price tier">Retail</div>
                <input type="hidden" id="price_tier" value="Retail" />
              </div>
              <div class="col-md-6">
                <input type="number" step="0.01" min="0" class="form-control" id="wholesale_price" placeholder="Wholesale Price" />
              </div>
              <div class="col-md-12">
                <select class="form-select" id="promo_id">
                  <option value="">-- NO PROMOTION --</option>
                </select>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer" id="blank-modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="submit" class="btn btn-primary" id="btn-submit" form="add-product-form">Submit</button>
        </div>
      </div>
    </div>
  </div>
  </body>
</html>
